# Runs the WordPress Coding Standards (WPCS) security/correctness sniffs plus
# PHP cross-version compatibility checks, as configured in phpcs.xml.dist.
# The ruleset is deliberately scoped to security and correctness (not whole-file
# formatting); see phpcs.xml.dist for the rationale.

name: PHPCS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP_CodeSniffer
        run: npm run lint:phpcs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up npm for Playground tooling
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install demo validation dependencies
        run: npm ci --ignore-scripts

      - name: Check Playground blueprint
        run: npm run demo:check
